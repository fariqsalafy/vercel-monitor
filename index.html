<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vercel Monitor</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --green: #3fb950;
  --yellow: #d29922;
  --orange: #db6d28;
  --red: #f85149;
  --blue: #58a6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  min-height: 100vh;
}
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
header h1 { font-size: 20px; }
header .meta { color: var(--muted); font-size: 13px; }
header .meta b { color: var(--text); }
.btn {
  background: var(--panel); border: 1px solid var(--border); color: var(--text);
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
}
.btn:hover { border-color: var(--blue); }
.btn:disabled { opacity: 0.5; cursor: wait; }
.btn-logout { border-color: var(--red); color: var(--red); font-size: 11px; padding: 3px 8px; }
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.card.featured { border-color: var(--blue); }
.card-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.card-value { font-size: 24px; font-weight: 600; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.card-value.large { font-size: 32px; }
.card-sub { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.3s, background 0.3s; }
.bar-fill.green { background: var(--green); }
.bar-fill.yellow { background: var(--yellow); }
.bar-fill.orange { background: var(--orange); }
.bar-fill.red { background: var(--red); }
section { margin-bottom: 24px; }
section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
tr:hover td { background: rgba(255,255,255,0.02); }
.pct { display: inline-block; min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
.pct.green { color: var(--green); }
.pct.yellow { color: var(--yellow); }
.pct.orange { color: var(--orange); }
.pct.red { color: var(--red); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.ready { background: var(--green); }
.status-dot.error { background: var(--red); }
.status-dot.building { background: var(--yellow); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.alert {
  background: rgba(248, 81, 73, 0.1);
  border: 1px solid var(--red);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.alert.warn { background: rgba(210, 153, 34, 0.1); border-color: var(--yellow); }
.alert.crit { background: rgba(248, 81, 73, 0.15); }
.alert.info { background: rgba(88, 166, 255, 0.1); border-color: var(--blue); }
.alert .level { font-weight: 600; margin-right: 6px; }
.empty { color: var(--muted); text-align: center; padding: 24px; font-size: 13px; }
.refresh-indicator { font-size: 11px; color: var(--muted); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.token-setup {
  max-width: 480px; margin: 60px auto; padding: 32px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
}
.token-setup h2 { margin-bottom: 12px; }
.token-setup p { color: var(--muted); margin-bottom: 16px; font-size: 14px; line-height: 1.5; }
.token-setup input {
  width: 100%; padding: 10px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; font-family: monospace; margin-bottom: 12px;
}
.token-setup .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.error-screen { padding: 40px; text-align: center; color: var(--red); }
</style>
</head>
<body>
<div id="root">Memuat...</div>

<script>
const EMBEDDED_TOKEN = atob('dmNwXzQzMDRWSlBUWjRsWGdEY1dBd0JQYkE4V2hPcm5zMmt6eXJ3Y2dtb3plTmVrOVBsdTZyNE1ZeWdp');
const EMBEDDED_TEAM = 'team_r8SrFdv3MW6i734CqzHgjFAB';
const STORAGE_KEY = 'vercel_monitor_token_override';
const TEAM_KEY = 'vercel_monitor_team_override';
let VERCEL_TOKEN = localStorage.getItem(STORAGE_KEY) || EMBEDDED_TOKEN;
let TEAM_ID = localStorage.getItem(TEAM_KEY) || EMBEDDED_TEAM;

const VERCEL_API = 'https://api.vercel.com';

const PRO_LIMITS = {
  includedCredit: 20,
  bandwidth: 1 * 1024 ** 4,
  edgeRequests: 10_000_000,
  functionMaxDuration: 300,
  functionDefaultDuration: 15,
  buildsPerDay: 6000,
  buildMinutesPerDeploy: 45,
};

function fmtBytes(b) {
  if (b == null) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1) + ' MB';
  if (b < 1024*1024*1024*1024) return (b/1024/1024/1024).toFixed(2) + ' GB';
  return (b/1024/1024/1024/1024).toFixed(2) + ' TB';
}
function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString('id-ID'); }
function fmtMoney(v) { return '$' + v.toFixed(2); }
function pct(used, total) { if (!total) return 0; return Math.min(100, (used / total) * 100); }
function pctClass(p) { return p >= 95 ? 'red' : p >= 85 ? 'orange' : p >= 70 ? 'yellow' : 'green'; }
function fmtDate(s) {
  if (!s) return '—';
  const diff = (new Date() - new Date(s)) / 1000;
  if (diff < 60) return Math.floor(diff) + 's';
  if (diff < 3600) return Math.floor(diff/60) + 'm';
  if (diff < 86400) return Math.floor(diff/3600) + 'h';
  return Math.floor(diff/86400) + 'd';
}

async function apiVercel(path) {
  const url = `${VERCEL_API}${path}${path.includes('?') ? '&' : '?'}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${VERCEL_TOKEN}` } });
  if (!res.ok) {
    if (res.status === 401) throw new Error('Token Vercel tidak valid.');
    throw new Error(`API ${path}: ${res.status} ${res.statusText}`);
  }
  return res.json();
}

function periodRange() {
  const now = new Date();
  const from = new Date(now); from.setDate(from.getDate() - 30);
  return { from: from.toISOString(), to: now.toISOString() };
}

async function fetchUsage(type, opts = {}) {
  const { from, to } = periodRange();
  const params = new URLSearchParams({ type, from, to });
  if (TEAM_ID) params.set('teamId', TEAM_ID);
  if (opts.projectId) params.set('projectId', opts.projectId);
  return apiVercel(`/v2/usage?${params}`);
}

async function fetchBilling() {
  const { from, to } = periodRange();
  const params = new URLSearchParams({ from: from.split('T')[0], to: to.split('T')[0] });
  if (TEAM_ID) params.set('teamId', TEAM_ID);
  const res = await fetch(`${VERCEL_API}/v1/billing/charges?${params}`, {
    headers: { Authorization: `Bearer ${VERCEL_TOKEN}` }
  });
  if (!res.ok) return { charges: [], total: 0 };
  const text = await res.text();
  const charges = text.trim().split('\n').filter(l => l).map(l => JSON.parse(l));
  return { charges, total: charges.reduce((s, c) => s + (c.BilledCost || 0), 0) };
}

async function fetchOverview() {
  const [team, projects, requests, builds, billing] = await Promise.all([
    apiVercel(`/v1/teams/${TEAM_ID}`),
    apiVercel(`/v9/projects?limit=100${TEAM_ID ? `&teamId=${TEAM_ID}` : ''}`),
    fetchUsage('requests'),
    fetchUsage('builds'),
    fetchBilling(),
  ]);
  return { team, projects: projects.projects || [], requests, builds, billing };
}

async function fetchProjectDetail(projectId) {
  const [proj, deploys, reqData] = await Promise.all([
    apiVercel(`/v9/projects/${projectId}${TEAM_ID ? `?teamId=${TEAM_ID}` : ''}`),
    apiVercel(`/v6/deployments?projectId=${projectId}&limit=1${TEAM_ID ? `&teamId=${TEAM_ID}` : ''}`),
    fetchUsage('requests', { projectId }),
  ]);
  return { proj, deploys: deploys.deployments || [], reqData };
}

function aggregateRequests(reqData) {
  if (!reqData?.data) return null;
  return reqData.data.reduce((acc, day) => {
    acc.bandwidth_outgoing_bytes += day.bandwidth_outgoing_bytes || 0;
    acc.bandwidth_incoming_bytes += day.bandwidth_incoming_bytes || 0;
    acc.function_invocation_successful_count += day.function_invocation_successful_count || 0;
    acc.function_invocation_error_count += day.function_invocation_error_count || 0;
    acc.function_execution_successful_gb_hours += day.function_execution_successful_gb_hours || 0;
    acc.request_hit_count += day.request_hit_count || 0;
    acc.request_miss_count += day.request_miss_count || 0;
    return acc;
  }, { bandwidth_outgoing_bytes: 0, bandwidth_incoming_bytes: 0, function_invocation_successful_count: 0, function_invocation_error_count: 0, function_execution_successful_gb_hours: 0, request_hit_count: 0, request_miss_count: 0 });
}

function aggregateBuilds(buildsData) {
  if (!buildsData?.data) return null;
  return buildsData.data.reduce((acc, day) => {
    acc.completed += day.build_completed_count || 0;
    acc.failed += day.build_failed_count || 0;
    acc.seconds += day.build_build_seconds || 0;
    acc.queued += day.build_queued_seconds || 0;
    return acc;
  }, { completed: 0, failed: 0, seconds: 0, queued: 0 });
}

function aggregateBillingByCategory(charges) {
  const by = {};
  for (const c of charges) {
    const cat = c.ServiceCategory || c.ServiceName || 'Other';
    if (!by[cat]) by[cat] = { cost: 0, qty: 0, unit: '' };
    by[cat].cost += c.BilledCost || 0;
    by[cat].qty += c.ConsumedQuantity || 0;
    by[cat].unit = c.ConsumedUnit || '';
  }
  return by;
}

function renderHeader(team) {
  const planName = team?.billing?.plan?.toUpperCase() || 'PRO';
  const planIter = team?.billing?.planIteration || '';
  const period = team?.billing?.period;
  const remaining = period ? Math.ceil((period.end - Date.now()) / 86400000) : null;
  return `<header>
    <div>
      <h1>Vercel Monitor — ${team?.name || 'smpabbs'}</h1>
      <div class="meta">Plan: <b>${planName}${planIter ? ' ' + planIter : ''}</b> · ${remaining != null ? `Reset: ${remaining} hari lagi` : '30 hari terakhir'}</div>
    </div>
    <div>
      <button class="btn" id="refresh">↻ Refresh</button>
      <button class="btn btn-logout" id="logout">Clear override</button>
      <span class="refresh-indicator" id="last-update"></span>
    </div>
  </header>`;
}

function renderBillingCard(billing) {
  const total = billing.total || 0;
  const creditUsed = (total / PRO_LIMITS.includedCredit) * 100;
  const remaining = Math.max(0, PRO_LIMITS.includedCredit - total);
  const cls = pctClass(creditUsed);
  return `<section><h2>💳 Billing Credit</h2><div class="summary">
    <div class="card featured">
      <div class="card-label">Credit Terpakai (30 hari)</div>
      <div class="card-value large">${fmtMoney(total)}</div>
      <div class="card-sub">dari $${PRO_LIMITS.includedCredit} included · sisa ${fmtMoney(remaining)}</div>
      <div class="bar"><div class="bar-fill ${cls}" style="width:${Math.min(creditUsed, 100)}%"></div></div>
      <div class="card-sub pct ${cls}" style="margin-top:6px">${creditUsed.toFixed(1)}% used</div>
    </div>
  </div></section>`;
}

function renderBillingBreakdown(billing) {
  const by = aggregateBillingByCategory(billing.charges);
  const rows = Object.entries(by)
    .filter(([_, d]) => d.cost > 0 || d.qty > 0)
    .sort((a, b) => b[1].cost - a[1].cost)
    .map(([cat, d]) => {
      const cls = d.cost > 5 ? 'red' : d.cost > 1 ? 'orange' : d.cost > 0.5 ? 'yellow' : 'green';
      return `<tr><td>${cat}</td><td>${d.qty.toLocaleString('id-ID', {maximumFractionDigits: 2})} ${d.unit}</td><td class="pct ${cls}">${fmtMoney(d.cost)}</td></tr>`;
    }).join('');
  if (!rows) return '<section><h2>📊 Breakdown Biaya</h2><div class="empty">Tidak ada charge dalam 30 hari terakhir.</div></section>';
  return `<section><h2>📊 Breakdown Biaya per Kategori (30 hari)</h2>
    <table><thead><tr><th>Kategori</th><th>Pemakaian</th><th>Biaya</th></tr></thead>
    <tbody>${rows}</tbody></table></section>`;
}

function renderSummary({ requests, builds }) {
  const r = aggregateRequests(requests) || {};
  const b = aggregateBuilds(builds) || {};
  const totalReq = (r.request_hit_count || 0) + (r.request_miss_count || 0);

  const cards = [
    { label: 'Bandwidth Out', used: r.bandwidth_outgoing_bytes, total: PRO_LIMITS.bandwidth, fmt: fmtBytes, totalFmt: '1 TB included' },
    { label: 'Bandwidth In', used: r.bandwidth_incoming_bytes, total: null, fmt: fmtBytes, totalFmt: 'Fast Origin Transfer' },
    { label: 'Edge Requests', used: totalReq, total: PRO_LIMITS.edgeRequests, fmt: fmtNum, totalFmt: '10M included' },
    { label: 'Function Invocations', used: r.function_invocation_successful_count, total: null, fmt: fmtNum, totalFmt: '$0.60/1M' },
    { label: 'Function Errors', used: r.function_invocation_error_count, total: null, fmt: fmtNum, totalFmt: 'pay-as-you-go' },
    { label: 'Function Duration', used: r.function_execution_successful_gb_hours, total: null, fmt: v => v.toFixed(2) + ' GB-hrs', totalFmt: 'Active CPU $0.128/hr' },
    { label: 'Cache Hits', used: r.request_hit_count, total: null, fmt: fmtNum, totalFmt: 'free' },
    { label: 'Cache Misses', used: r.request_miss_count, total: null, fmt: fmtNum, totalFmt: 'real invocations' },
    { label: 'Builds Completed', used: b.completed, total: PRO_LIMITS.buildsPerDay, fmt: fmtNum, totalFmt: '6000/hari' },
    { label: 'Builds Failed', used: b.failed, total: null, fmt: fmtNum, totalFmt: `${((b.failed / Math.max(b.completed, 1)) * 100).toFixed(1)}% fail rate` },
    { label: 'Total Build Time', used: b.seconds / 60, total: null, fmt: v => v.toFixed(1) + ' min', totalFmt: 'max 45 min/deploy' },
  ];

  return `<section><h2>📊 Pemakaian 30 Hari</h2><div class="summary">${cards.map(c => {
    const p = c.total ? pct(c.used || 0, c.total) : 0;
    const cls = pctClass(p);
    return `<div class="card">
      <div class="card-label">${c.label}</div>
      <div class="card-value">${c.fmt(c.used || 0)}</div>
      <div class="card-sub">${c.totalFmt}</div>
      ${c.total ? `<div class="bar"><div class="bar-fill ${cls}" style="width:${p}%"></div></div>
      <div class="card-sub pct ${cls}" style="margin-top:6px">${p.toFixed(1)}%</div>` : ''}
    </div>`;
  }).join('')}</div></section>`;
}

function renderAlerts({ requests, billing }) {
  const alerts = [];
  const r = aggregateRequests(requests) || {};

  const creditPct = (billing.total || 0) / PRO_LIMITS.includedCredit * 100;
  if (creditPct >= 70) {
    const lvl = creditPct >= 95 ? '🚨 KRITIS' : creditPct >= 85 ? '⚠️ TINGGI' : '⏰ WASPADA';
    const cls = creditPct >= 95 ? 'crit' : creditPct >= 85 ? '' : 'warn';
    alerts.push({ lvl, cls, txt: `Credit $${PRO_LIMITS.includedCredit}/bln sudah ${creditPct.toFixed(0)}% terpakai (${fmtMoney(billing.total)}). Akan kena on-demand billing setelah credit habis.` });
  }

  const bwPct = pct(r.bandwidth_outgoing_bytes || 0, PRO_LIMITS.bandwidth);
  if (bwPct >= 70) {
    const lvl = bwPct >= 95 ? '🚨 KRITIS' : '⚠️ TINGGI';
    alerts.push({ lvl, cls: bwPct >= 95 ? 'crit' : '', txt: `Bandwidth mendekati 1 TB included (${bwPct.toFixed(0)}% = ${fmtBytes(r.bandwidth_outgoing_bytes)}).` });
  }

  if ((r.function_invocation_error_count || 0) > 1000) {
    alerts.push({ lvl: '🐛 BUG', cls: 'warn', txt: `${fmtNum(r.function_invocation_error_count)} function errors dalam 30 hari. Cek log.` });
  }

  if (!alerts.length) {
    alerts.push({ lvl: '✅ INFO', cls: 'info', txt: `Semua aman. Credit terpakai ${creditPct.toFixed(0)}%, bandwidth ${bwPct.toFixed(0)}%.` });
  }

  return `<section><h2>⚡ Alerts (${alerts.length})</h2>${alerts.map(a => `
    <div class="alert ${a.cls}"><span class="level">${a.lvl}</span> ${a.txt}</div>
  `).join('')}</section>`;
}

async function renderProjects(projects, requests) {
  if (!projects.length) return '<section><h2>📦 Projects</h2><div class="empty">Tidak ada project.</div></section>';

  const totalBw = requests?.data?.reduce((s, d) => s + (d.bandwidth_outgoing_bytes || 0), 0) || 0;

  const rows = await Promise.all(projects.map(async p => {
    let detail = { deploys: [], reqData: null };
    try { detail = await fetchProjectDetail(p.id); } catch {}
    const last = detail.deploys[0];
    const state = last?.readyState || '—';
    const dotClass = state === 'READY' ? 'ready' : state === 'ERROR' ? 'error' : state === 'BUILDING' ? 'building' : '';

    let usageStr = '—';
    if (detail.reqData?.data) {
      const projBw = detail.reqData.data.reduce((s, d) => s + (d.bandwidth_outgoing_bytes || 0), 0);
      const pctBw = totalBw ? (projBw / totalBw) * 100 : 0;
      const fnCount = detail.reqData.data.reduce((s, d) => s + (d.function_invocation_successful_count || 0), 0);
      usageStr = `<span class="pct ${pctClass(pctBw)}">${pctBw.toFixed(0)}% bw</span> · ${fmtBytes(projBw)} · ${fmtNum(fnCount)} inv`;
    }

    const url = detail.proj?.link?.production || detail.proj?.link?.deployment;
    return `<tr>
      <td><a href="https://vercel.com/dashboard/${p.id}" target="_blank">${p.name}</a>${url ? ` · <a href="${url}" target="_blank">↗</a>` : ''}</td>
      <td><span class="status-dot ${dotClass}"></span>${state}${last ? ' · ' + fmtDate(last.createdAt) : ''}</td>
      <td>${usageStr}</td>
      <td>${fmtDate(p.updatedAt)}</td>
    </tr>`;
  }));

  return `<section><h2>📦 Projects (${projects.length})</h2>
    <table><thead><tr><th>Name</th><th>Last Deploy</th><th>Pemakaian (30d)</th><th>Updated</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></section>`;
}

function renderError(msg) {
  return `<div class="error-screen">
    <h2>⚠️ Gagal memuat data</h2>
    <p>${msg}</p>
    <div class="token-setup" style="margin-top:20px;text-align:left">
      <h2>🔑 Override Token</h2>
      <p>Token embed mungkin expired. Masukkan token baru (disimpan di browser ini saja).</p>
      <input id="tok-input" type="password" placeholder="vcp_xxx atau pat_xxx" />
      <input id="team-input" placeholder="teamId (opsional, contoh: team_xxx)" />
      <button class="btn" id="tok-save">Simpan & Coba Lagi</button>
    </div>
  </div>`;
}

async function refresh() {
  const root = document.getElementById('root');
  const btn = document.getElementById('refresh');
  if (btn) btn.disabled = true;
  try {
    const data = await fetchOverview();
    document.getElementById('root').innerHTML =
      renderHeader(data.team) + renderBillingCard(data.billing) + renderBillingBreakdown(data.billing) + renderSummary(data) + renderAlerts(data) + '<div id="projects-area">Memuat projects...</div>';
    document.getElementById('last-update').textContent = '· ' + new Date().toLocaleTimeString('id-ID');
    bindActions();
    renderProjects(data.projects, data.requests).then(h => { document.getElementById('projects-area').innerHTML = h; });
  } catch (e) {
    document.getElementById('root').innerHTML = renderError(e.message);
    document.getElementById('tok-save').onclick = () => {
      const v = document.getElementById('tok-input').value.trim();
      const t = document.getElementById('team-input').value.trim();
      if (v) { localStorage.setItem(STORAGE_KEY, v); VERCEL_TOKEN = v; }
      if (t) { localStorage.setItem(TEAM_KEY, t); TEAM_ID = t; }
      refresh();
    };
  }
  if (btn) btn.disabled = false;
}

function bindActions() {
  const r = document.getElementById('refresh');
  const l = document.getElementById('logout');
  if (r) r.onclick = refresh;
  if (l) l.onclick = () => {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TEAM_KEY);
    VERCEL_TOKEN = EMBEDDED_TOKEN;
    TEAM_ID = EMBEDDED_TEAM;
    refresh();
  };
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
